<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANF Night Festival Scoreboard</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#fff;font-family:Arial,'Malgun Gothic',sans-serif}.wrap{display:flex;gap:12px;width:100%;}.player{flex:1;min-width:0;background:rgba(15,18,28,.94);border:1px solid #5a6278;border-radius:12px;padding:14px 18px;box-shadow:0 4px 18px #0006}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.name{font-size:24px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.slot{font-size:13px;opacity:.65}.acc{font-size:46px;font-weight:900;letter-spacing:-1px;margin:5px 0 9px;font-variant-numeric:tabular-nums}.counts{display:flex;justify-content:space-between;gap:8px;font-size:16px;font-weight:700}.counts span{display:block;text-align:center}.counts small{display:block;font-size:10px;opacity:.65;margin-bottom:3px}.perfect{color:#7cff6b}.early{color:#ff7474}.late{color:#67b5ff}.miss{color:#ffb454}.overload{color:#d39aff}.status{font-size:12px;opacity:.65;margin-top:9px}.stale{opacity:.45}.title{font-size:12px;letter-spacing:3px;opacity:.6;margin:0 0 8px 4px}
</style></head><body><div class="title">ADOFAI NIGHT FESTIVAL · LIVE SCORE</div><div class="wrap"><section class="player" id="cardA"><div class="top"><div class="name" id="nameA">PLAYER A</div><div class="slot">PLAYER A</div></div><div class="acc" id="accA">--.---%</div><div class="counts"><span class="perfect"><small>PERFECT</small><b id="perfectA">--</b></span><span class="early"><small>EARLY</small><b id="earlyA">--</b></span><span class="late"><small>LATE</small><b id="lateA">--</b></span><span class="miss"><small>MISS</small><b id="missA">--</b></span><span class="overload"><small>OVERLOAD</small><b id="overloadA">--</b></span></div><div class="status" id="statusA">연결 대기 중</div></section><section class="player" id="cardB"><div class="top"><div class="name" id="nameB">PLAYER B</div><div class="slot">PLAYER B</div></div><div class="acc" id="accB">--.---%</div><div class="counts"><span class="perfect"><small>PERFECT</small><b id="perfectB">--</b></span><span class="early"><small>EARLY</small><b id="earlyB">--</b></span><span class="late"><small>LATE</small><b id="lateB">--</b></span><span class="miss"><small>MISS</small><b id="missB">--</b></span><span class="overload"><small>OVERLOAD</small><b id="overloadB">--</b></span></div><div class="status" id="statusB">연결 대기 중</div></section></div>
<script>
const q=new URLSearchParams(location.search),room=q.get('room')||'anf-test';const selected=(q.get('player')||'both').toUpperCase();const base=location.origin;const $=id=>document.getElementById(id);
if(selected==='A'||selected==='B'){const hide=selected==='A'?'B':'A';$('card'+hide).remove();document.querySelector('.wrap').style.maxWidth='100%';document.querySelector('.player').style.flex='1';document.querySelector('.title').textContent='ADOFAI NIGHT FESTIVAL · PLAYER '+selected;}else{document.querySelector('.title').textContent='ADOFAI NIGHT FESTIVAL · LIVE SCORE';}
function render(slot,p){const s=slot.toUpperCase(),card=$('card'+s);card.classList.toggle('stale',!p||p.stale||!p.ok);if(!p){$('status'+s).textContent='참가자 연결 대기 중';return;}$('name'+s).textContent=p.name||('PLAYER '+s);$('acc'+s).textContent=p.ok?Number(p.acc).toFixed(3)+'%':'--.---%';for(const k of ['perfect','early','late','miss','overload'])$(''+k+s).textContent=p.countsOk?Number(p[k]||0).toLocaleString():'--';$('status'+s).textContent=p.stale?'데이터 지연 / 연결 확인 필요':(p.ok?({'playing':'플레이 중','waiting':'대기','clear':'클리어','fail':'실패'}[p.status]||p.status):'게임 데이터 읽기 실패');}
async function tick(){try{const r=await fetch(base+'/api/state?room='+encodeURIComponent(room),{cache:'no-store'});const d=await r.json();render('A',d.players&&d.players.A);render('B',d.players&&d.players.B);}catch(e){$('statusA').textContent=$('statusB').textContent='서버 연결 중…';}setTimeout(tick,250)}tick();
</script></body></html>
